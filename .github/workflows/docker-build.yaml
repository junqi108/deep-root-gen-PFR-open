name: Promote verified DeepRootGen image

on:
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: deeprootgen-ghcr-latest-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'junqi108/deep-root-gen-PFR-open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: ghcr.io/junqi108/deep-root-gen-pfr-open
      SOURCE_TAG: sha-eaafc333c9cd44c2d00b73428e246ac56c12de34
      EXPECTED: sha256:ba9273f5c543c5cf8dc82a1f5b545ec6bd5bd48ad474676b3f347b76f4a629df
    steps:
      - name: Promote the verified manifest by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" {print $2; exit}'
          }
          test "$(digest "$PACKAGE:$SOURCE_TAG")" = "$EXPECTED"
          docker buildx imagetools create --tag "$PACKAGE:latest" "$PACKAGE@$EXPECTED"
          test "$(digest "$PACKAGE:latest")" = "$EXPECTED"
          printf 'Published %s:latest at %s\n' "$PACKAGE" "$EXPECTED" >> "$GITHUB_STEP_SUMMARY"
